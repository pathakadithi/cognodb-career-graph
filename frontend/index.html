<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CognoDB Career Graph</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CognoDB Career Graph</h1>
        <p>Career Intelligence Dashboard</p>
    </header>

    <main>

        <!-- Candidate -->
        <section>
            <h2>Candidate Profile</h2>

            <div id="candidate" class="candidate-card">
                <p class="loading">Loading candidate...</p>
            </div>
        </section>


        <!-- Job Matches -->
        <section>
            <h2>Job Matches</h2>

            <div id="job-matches" class="card-container">
                <p class="loading">Loading job matches...</p>
            </div>
        </section>


        <!-- Skill Gaps -->
        <section>
            <h2>Skill Gaps</h2>

            <div id="skill-gaps" class="card-container">
                <p class="loading">Loading skill gaps...</p>
            </div>
        </section>


        <!-- Projects -->
        <section>
            <h2>Projects</h2>

            <div id="projects" class="card-container">
                <p class="loading">Loading projects...</p>
            </div>
        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
